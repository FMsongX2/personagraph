name: tests
on: [push, pull_request]
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: runtime/aichat-upstream/rust-search-ui
      - name: Install backup dependency
        run: |
          if [ "$RUNNER_OS" = "macOS" ]; then brew install restic; else sudo apt-get update && sudo apt-get install -y restic; fi
      - name: Prepare private synthetic notebook
        run: python scripts/init-memory.py
      - name: Install pinned search engine
        run: python scripts/install-aichat-search.py
      - name: Tests
        run: |
          python scripts/test-alignment-memory.py
          python scripts/test-alignment-capture.py
          python scripts/test-evidence-backup.py
          python scripts/test-public-install.py
      - name: Release file check
        run: python scripts/check-public.py
